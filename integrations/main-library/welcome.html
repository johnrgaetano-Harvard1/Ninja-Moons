<style>

.entry-bar{position:absolute;top:29%;left:0;z-index:2;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px) minmax(0,1fr);align-items:center;gap:10px;padding:3px 12px;min-height:44px;background:#092541;border-bottom:1px solid #37728b;color:#e9f8ff}
.entry-link{display:flex;align-items:center;justify-content:center;min-height:36px;text-align:center;color:#dbf6ff;text-decoration:none;font-size:13px;font-weight:750;line-height:1.35}.entry-link:last-of-type{color:#ffe39a}.entry-link:hover{color:white;text-decoration:underline;text-underline-offset:4px}
#entrance{display:flex;align-items:center;justify-content:center;gap:0;width:100%;min-width:0;margin:0;border:1px solid #63c5e5;border-radius:8px;background:#071b33;overflow:hidden;height:34px}
#student-password{position:static;min-width:0;width:100%;flex:1 1 auto;border:0;margin:0;padding:10px 12px;height:100%;background:transparent;color:white;font:15px Arial,sans-serif;outline:0}#student-password::placeholder{color:#b7d4e7;opacity:1}
#student-login{position:static;flex:0 0 auto;height:100%;border:0;margin:0;padding:0 18px;background:#74e4ff;color:#07263b;font:800 14px Arial,sans-serif;cursor:pointer}#student-login:hover{background:#b1f4ff}#student-login:disabled{cursor:progress;opacity:.6}
.entry-link:focus-visible,#student-login:focus-visible{outline:3px solid white;outline-offset:-3px}#entrance:focus-within{outline:2px solid #a4efff;outline-offset:2px}
#login-message{position:absolute;top:100%;left:50%;transform:translateX(-50%);z-index:20;width:min(94%,520px);margin:4px 0 0;padding:10px 14px;background:#772c46;color:white;border-radius:8px;text-align:center;font-size:14px;box-shadow:0 5px 15px #05172b77}#login-message[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
#nm-race-entry{position:fixed;z-index:20;right:clamp(12px,3vw,26px);bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;background:#073a68ee;border:2px solid #76dfff;color:#fff;text-decoration:none;font:800 clamp(13px,1.7vw,17px)/1.2 Arial,sans-serif;padding:13px 17px;border-radius:999px;box-shadow:0 4px 18px #001329cc}#nm-race-entry:hover,#nm-race-entry:focus-visible{background:#125a94;outline:3px solid #a6f7ff;outline-offset:2px}
@media(max-width:620px){.entry-bar{grid-template-columns:minmax(0,1fr) minmax(0,1.65fr) minmax(0,1fr);gap:4px;padding:2px 6px;min-height:36px}.entry-link{font-size:10px;min-height:32px}.entry-link span{display:block}#entrance{height:30px}#student-password{font-size:11px;padding:6px 5px}#student-login{font-size:11px;padding:0 7px}}
@media(max-width:440px){#nm-race-entry{left:12px;right:12px;justify-content:center;padding:12px 10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head>

<main class="poster" aria-label="NINJA MOONS: The Seven-Second Journey">
<img src="https://ninja-reader-story-library.vercel.app/entrance-art.webp" width="1700" height="2200" alt="Kai, Mira, Pip and Master Ren exploring a brilliant futuristic moon city beneath the NINJA MOONS logo.">
<section class="entry-bar" aria-label="Sign in or discover NINJA MOONS">
<a class="entry-link" href="/about.html"><span>About <span>NINJA MOONS</span></span></a>
<form id="entrance" action="/api/login" method="post">
<label for="student-password" class="sr-only">Story password</label>
<input id="student-password" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required maxlength="72" spellcheck="false">
<button id="student-login" type="submit" aria-label="Login and begin the NINJA MOONS story">Login →</button>
</form>
<a class="entry-link" href="/about.html#join"><span>New here? <span>Start here →</span></span></a>
<p id="login-message" role="alert" aria-live="polite" hidden></p>
</section>
</main>
<a id="nm-race-entry" href="https://ninja-reading-race.vercel.app/" aria-label="Open the NINJA MOONS reading race for teachers and students">🚀 Reading Race · Join or Host</a>
<script>
(function(){
'use strict';
var form=document.getElementById('entrance'),button=document.getElementById('student-login'),input=document.getElementById('student-password'),msg=document.getElementById('login-message');
form.addEventListener('submit',async function(event){
event.preventDefault();
if(!input.value)return;
button.disabled=true;msg.hidden=true;
try{
 var response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({password:input.value})});
 var result=await response.json().catch(function(){return {};});
 if(!response.ok||result.success!==true)throw new Error(result.error||'Incorrect password. Try again.');
 window.location.assign('/dashboard');
}catch(err){msg.textContent=err.message||'Could not sign in. Please try again.';msg.hidden=false;input.focus();input.select();}
finally{button.disabled=false;input.value='';}
});
})();
</script></body></html>
